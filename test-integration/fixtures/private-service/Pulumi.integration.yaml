  gcp:region: europe-west1
  runway-integration-private:location: europe-west1
  # Google's own always-available sample image: no Artifact Registry push is
  # needed to exercise the Cloud Run controls, and the tier stays independent of
  # a build.
  runway-integration-private:image: gcr.io/cloudrun/hello
  runway-integration-private:serviceAccountEmail: runway-api@enduring-badge-506610-u9.iam.gserviceaccount.com
