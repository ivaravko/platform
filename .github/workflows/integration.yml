name: integration
on:
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch: {}
jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.RUNWAY_SANDBOX_PROJECT }}
    if: ${{ vars.RUNWAY_PLATFORM_WIF_PROVIDER != '' }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: authenticate_to_google_cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.RUNWAY_PLATFORM_WIF_PROVIDER }}
          service_account: ${{ vars.RUNWAY_PLATFORM_CI_SERVICE_ACCOUNT }}
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install Pulumi
        id: install_pulumi
        run: curl -fsSL https://get.pulumi.com | sh && echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        id: install_dependencies
        run: npm ci
      - name: Integration tiers
        id: integration_tiers
        run: npm run test:integration
      - name: Verify the sandbox is empty
        id: verify_the_sandbox_is_empty
        if: always()
        run: npm run test:integration:verify
